[package]
name = "nova-live"
description = "Colaboração em tempo real comum aos apps Nova Foods"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
getrandom = "0.4"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12", "logging"] }
webpki-roots = "1"

[target.'cfg(target_os = "macos")'.dependencies]
nova-live-macos = { path = "../nova-live-macos" }
